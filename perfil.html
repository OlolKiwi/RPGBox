<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfil · RPGBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="fichas.js"></script>
<style>
[hidden]{display:none!important}
.pf{--ac:hsl(var(--h,265) 85% 68%);max-width:640px;margin:0 auto;padding:22px 16px 80px;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.pf *{box-sizing:border-box}
.pf button,.pf input,.pf textarea{font:inherit;color:inherit}
.pf :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pf-btn{background:var(--ac);color:#10091c;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}
.pf-btn:hover{filter:brightness(1.1)}.pf-btn:active{transform:scale(.97)}
.pf-btn.g{background:#fff1;color:inherit;border:1px solid #fff2}
.pf-in{width:100%;background:#0003;border:1px solid #fff2;border-radius:12px;padding:12px 14px}
.pf-in::placeholder{color:#fff7}
textarea.pf-in{resize:vertical;min-height:72px}
.pf-hint{opacity:.65;font-size:.82rem}
.pf-guest{text-align:center;padding:50px 22px;border-radius:22px;margin-top:30px;display:grid;gap:12px;justify-items:center}
.pf-guest h1{font-size:1.6rem}
.pf-card{border-radius:24px;overflow:hidden}
.pf-banner{height:170px;position:relative;overflow:hidden}
.pf-banner>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pf-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,hsl(var(--h,265) 30% 10% / .85))}
.bg-aurora{background:linear-gradient(120deg,#3b1d6e,#0f6b7a,#b4457a,#3b1d6e);background-size:300% 300%;animation:pf-flow 10s ease infinite}
.bg-sangue{background:radial-gradient(circle at 20% 120%,#c2171f,transparent 55%),radial-gradient(circle at 80% -10%,#5a0a14,transparent 60%),#1a0509;background-size:140% 140%;animation:pf-flow 8s ease infinite}
.bg-neon{background:repeating-linear-gradient(90deg,#ff2a6d22 0 2px,transparent 2px 36px),linear-gradient(135deg,#05d9e8,#7a1fff,#ff2a6d);background-size:auto,300% 300%;animation:pf-flow 6s linear infinite}
.bg-papel{background:radial-gradient(circle at 30% 30%,#d9c597,#8a7347 90%);animation:pf-breathe 6s ease-in-out infinite}
.bg-stand{background:repeating-conic-gradient(from 0deg at 50% 120%,#6a2cc9 0 8deg,#f2c230 8deg 16deg);animation:pf-spin 40s linear infinite;transform-origin:50% 120%;filter:saturate(.85) brightness(.8)}
.bg-floresta{background:linear-gradient(160deg,#0f3d2e,#2d6a3f,#0b2a2a);background-size:250% 250%;animation:pf-flow 12s ease infinite}
@keyframes pf-flow{50%{background-position:100% 100%}}
@keyframes pf-breathe{50%{filter:brightness(1.25)}}
@keyframes pf-spin{to{transform:rotate(360deg)}}
.pf-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:-64px;padding:0 18px 22px;position:relative;z-index:2}
.pf-av{position:relative;width:128px;height:128px;border-radius:50%;padding:5px}
.pf-av::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ac),#fff7,var(--ac),#0000,var(--ac));animation:pf-spin 5s linear infinite}
.pf-av img{position:relative;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid hsl(var(--h,265) 30% 12%);background:#2a2038}
.r-arco::before{background:conic-gradient(#ff5e5e,#ffd23f,#5eff8a,#3fd0ff,#b45eff,#ff5e5e)}
.r-chama::before{background:conic-gradient(#ff3b00,#ffb300,#ff3b00,#7a1500,#ff3b00);filter:blur(1px)}
.r-pulso::before{animation:pf-pulse 2.2s ease-in-out infinite;background:var(--ac)}
@keyframes pf-pulse{50%{box-shadow:0 0 28px 6px var(--ac);opacity:.7}}
.r-nenhum::before{display:none}
.pf-name{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;margin-top:12px;font-size:1.7rem;font-weight:700;line-height:1.15;word-break:break-word}
.pf-sub{opacity:.65;margin-top:4px}
.pf-badges{display:inline-flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pf-badge{--c:#e0a43c;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:99px;font-size:.78rem;font-weight:700;color:#fff;background:color-mix(in srgb,var(--c) 30%,#120b1d);border:1px solid color-mix(in srgb,var(--c) 70%,transparent)}
.pf-badge::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#fff4 50%,transparent 65%);transform:translateX(-120%);animation:pf-shine 4.5s infinite}
.pf-badge:nth-child(2)::after{animation-delay:.7s}.pf-badge:nth-child(3)::after{animation-delay:1.4s}.pf-badge:nth-child(4)::after{animation-delay:2.1s}.pf-badge:nth-child(5)::after{animation-delay:2.8s}
@keyframes pf-shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.pf-stats{display:flex;justify-content:center;margin:18px 0 12px}
.pf-stats div{padding:0 26px;text-align:center}
.pf-stats div+div{border-left:1px solid #fff2}
.pf-stats b{display:block;font-size:1.25rem}
.pf-stats span{opacity:.65;font-size:.9rem}
.pf-bio{max-width:44ch;white-space:pre-wrap;word-break:break-word}
.pf-acts{display:flex;gap:10px;margin-top:16px}
.pf-tabs{display:flex;border-top:1px solid #fff2}
.pf-tabs button{flex:1;background:none;border:0;padding:14px;cursor:pointer;opacity:.6;border-bottom:2px solid transparent}
.pf-tabs button[aria-selected=true]{opacity:1;border-color:var(--ac);font-weight:700}
.pf-pane{padding:18px;min-height:130px}
.pf-list{display:grid;gap:8px}
.pf-list a{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:#fff1;color:inherit;text-decoration:none}
.pf-list small{opacity:.65}
.pf-empty{text-align:center;opacity:.7;padding:18px 0}
.pf-allb{display:flex;flex-wrap:wrap;gap:8px}
.pf-allb .pf-badge{opacity:.35;border-style:dashed}.pf-allb .pf-badge.on{opacity:1;border-style:solid}
.pf-ov{position:fixed;inset:0;background:#0009;display:grid;place-items:end center;z-index:50}
.pf-ov[hidden]{display:none}
@media(min-width:700px){.pf-ov{place-items:center;padding:20px}}
.pf-box{width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px;display:grid;gap:16px;background:hsl(var(--h,265) 28% 14%)}
@media(min-width:700px){.pf-box{border-radius:22px}}
.pf-box fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.pf-box legend,.pf-box label.l{font-weight:700;margin-bottom:2px}
.pf-row{display:flex;flex-wrap:wrap;gap:8px}
.pf-chip{border:1px solid #fff2;background:#0003;border-radius:10px;padding:7px 12px;cursor:pointer}
.pf-chip[aria-pressed=true]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 22%,transparent)}
.pf-bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.pf-bgs .pf-chip{height:52px;position:relative;overflow:hidden;padding:0;display:grid;place-items:end start}
.pf-bgs i{position:absolute;inset:0}
.pf-bgs span{position:relative;font-size:.75rem;padding:2px 7px;background:#000a;border-radius:0 8px 0 0}
.pf-pick .pf-badge{cursor:pointer;opacity:.5;border-style:dashed}
.pf-pick .pf-badge[aria-pressed=true]{opacity:1;border-style:solid}
.pf-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){.pf *,.pf *::before,.pf *::after{animation:none!important}}
</style>
</head>
<body>

<header class="glass" id="top">
  <div class="logo">
    <i><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 12 3 7M12 12l9-5M12 12v10"/></svg></i>
    <span>RPGBox</span>
  </div>
  <nav aria-label="Áreas do site">
    <a href="index.html#fichas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Fichas</a>
    <a href="mapas.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapas</a>
    <a href="campanhas.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Campanhas</a>
  </nav>
</header>

<main class="pf">
  <section class="glass pf-guest" id="guest" hidden>
    <h1>Seu perfil de player</h1>
    <p>Entre na sua conta para ver e editar o seu perfil.</p>
    <button class="pf-btn" id="g-in" type="button">Entrar</button>
  </section>

  <section class="glass pf-card" id="me" hidden>
    <div class="pf-banner" id="banner"></div>
    <div class="pf-head">
      <div class="pf-av" id="av"><img id="avimg" alt="Foto de perfil"></div>
      <div class="pf-name"><span id="pname"></span><span class="pf-badges" id="pbadges"></span></div>
      <div class="pf-sub" id="psub"></div>
      <div class="pf-stats">
        <div><b id="s-f">0</b><span>Fichas</span></div>
        <div><b id="s-b">0</b><span>Insígnias</span></div>
        <div><b id="s-d">-</b><span>Na mesa desde</span></div>
      </div>
      <p class="pf-bio" id="pbio"></p>
      <div class="pf-acts"><button class="pf-btn" id="edit" type="button">Editar perfil</button></div>
    </div>
    <div class="pf-tabs" role="tablist">
      <button role="tab" id="t-f" aria-selected="true">Fichas</button>
      <button role="tab" id="t-b" aria-selected="false">Insígnias</button>
    </div>
    <div class="pf-pane" id="pane"></div>
  </section>
</main>

<div class="pf-ov" id="ov" hidden>
  <div class="pf-box glass pf" role="dialog" aria-modal="true" aria-label="Editar perfil">
    <h2>Editar perfil</h2>
    <fieldset><label class="l" for="f-name">Nome</label><input class="pf-in" id="f-name" maxlength="24"></fieldset>
    <fieldset><label class="l" for="f-handle">Nome de usuário</label><input class="pf-in" id="f-handle" maxlength="20" placeholder="sem espaços, ex: olol"></fieldset>
    <fieldset><label class="l" for="f-pron">Pronomes</label><input class="pf-in" id="f-pron" maxlength="16" placeholder="ele/dele"></fieldset>
    <fieldset><label class="l" for="f-bio">Bio</label><textarea class="pf-in" id="f-bio" maxlength="140"></textarea></fieldset>
    <fieldset><label class="l" for="f-av">Foto ou GIF de perfil</label><input class="pf-in" id="f-av" type="url" placeholder="Link de imagem ou GIF (https://…)">
      <span class="pf-hint">Vazio = foto da sua conta Google, se houver.</span></fieldset>
    <fieldset><legend>Fundo do perfil</legend><div class="pf-bgs" id="presets"></div>
      <input class="pf-in" id="f-bg" type="url" placeholder="Ou link de imagem, GIF, MP4 ou WebM"></fieldset>
    <fieldset><legend>Anel da foto</legend><div class="pf-row" id="rings"></div></fieldset>
    <fieldset><legend>Insígnias <span class="pf-hint" id="bcount"></span></legend><div class="pf-row pf-pick" id="bpick"></div></fieldset>
    <div class="pf-bar"><button class="pf-btn" id="save" type="button">Salvar</button><button class="pf-btn g" id="cancel" type="button">Cancelar</button><span class="pf-hint" id="toast" role="status"></span></div>
  </div>
</div>

<script>
(function(){var r=document.documentElement,s={h:265,glass:7,blur:18,solid:false};
try{s=Object.assign(s,JSON.parse(localStorage.getItem("vtt-tema"))||{})}catch(e){}
r.style.setProperty("--h",s.h);r.style.setProperty("--glass",s.glass/100);r.style.setProperty("--blur",s.blur+"px");r.dataset.style=s.solid?"solid":"glass"})();
</script>
<script type="module" src="usuario.js"></script>
<script type="module">
import { auth, db, letterAvatar, okUrl } from "./firebase.js";
import { onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const BADGES=[
 {id:"mestre",e:"🎲",t:"Mestre",c:"#e0a43c"},{id:"player",e:"🗡️",t:"Player",c:"#4f9dff"},
 {id:"veterano",e:"🏆",t:"Veterano",c:"#f2c230"},{id:"lorista",e:"📜",t:"Lorista",c:"#c9a46a"},
 {id:"critico",e:"🎯",t:"Crítico 20",c:"#5eff8a"},{id:"falha",e:"💀",t:"Falha Crítica",c:"#ff5e5e"},
 {id:"cthulhu",e:"🐙",t:"Sanidade Frágil",c:"#38b79a"},{id:"cyber",e:"⚡",t:"Edgerunner",c:"#ff2a6d"},
 {id:"stand",e:"✨",t:"Stand User",c:"#a45bff"},{id:"combo",e:"🩸",t:"Combeiro",c:"#ff7eb6"},
 {id:"artista",e:"🎨",t:"Artista",c:"#ff9a3d"},{id:"ordem",e:"🔍",t:"Ordo Realitas",c:"#7c8cff"}];
const PRESETS=[["aurora","Aurora"],["sangue","Sangue"],["neon","Neon"],["papel","Papel velho"],["floresta","Floresta"]];
const RINGS=[["giro","Giratório"],["arco","Arco-íris"],["chama","Chama"],["pulso","Pulsante"],["nenhum","Sem anel"]];
const PAGES={"":"ficha.html",op:"ficha_op.html",ordem:"ficha_ordem.html",sentim:"ficha_sentim.html",jojo:"ficha_jojo.html",coc:"ficha_cthulhu.html",red:"ficha_red.html"};
const MAXB=5,$=id=>document.getElementById(id);
const FIELDS=[["f-name","name"],["f-handle","handle"],["f-pron","pron"],["f-bio","bio"],["f-av","avatar"],["f-bg","bg"]];
let user=null,tab="f",snap=null;
let S={name:"",handle:"",pron:"",bio:"",avatar:"",bg:"",bgPreset:"aurora",ring:"giro",badges:[]};

$("g-in").onclick=()=>document.getElementById("ubtn")?.click();

onAuthStateChanged(auth,async u=>{
 user=u;$("guest").hidden=!!u;$("me").hidden=!u;
 if(!u)return;
 try{const s=await getDoc(doc(db,"users",u.uid));if(s.exists())S={...S,...s.data()}}catch(e){console.warn(e)}
 if(!S.name)S.name=u.displayName||"";
 if(!S.handle)S.handle=(S.name||"player").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,20);
 render();
});

function fichas(){try{return FICHAS.list()}catch{return[]}}
function badge(x,tag="span"){const s=document.createElement(tag);s.className="pf-badge";s.style.setProperty("--c",x.c);s.textContent=x.e+" "+x.t;return s}

function render(){
 $("pname").textContent=S.name||"Player";
 $("psub").textContent=["@"+S.handle,S.pron].filter(x=>x&&x!=="@").join(" · ");
 $("pbio").textContent=S.bio;$("pbio").hidden=!S.bio;
 const img=$("avimg");img.onerror=()=>{img.onerror=null;img.src=letterAvatar(S.name)};
 img.src=okUrl(S.avatar)?S.avatar:(user?.photoURL||letterAvatar(S.name));
 $("av").className="pf-av r-"+S.ring;
 const b=$("banner");b.textContent="";
 if(okUrl(S.bg)){const v=/\.(mp4|webm)(\?|$)/i.test(S.bg),el=document.createElement(v?"video":"img");el.src=S.bg;
  if(v)Object.assign(el,{autoplay:true,loop:true,muted:true,playsInline:true});b.appendChild(el)}
 else{const d=document.createElement("div");d.className="bg-"+S.bgPreset;b.appendChild(d)}
 $("pbadges").textContent="";
 S.badges.forEach(id=>{const x=BADGES.find(k=>k.id===id);if(x)$("pbadges").appendChild(badge(x))});
 $("s-f").textContent=fichas().length;$("s-b").textContent=S.badges.length;
 const ct=user?.metadata?.creationTime;$("s-d").textContent=ct?new Date(ct).getFullYear():"-";
 $("bcount").textContent=`(${S.badges.length}/${MAXB})`;
 document.querySelectorAll("[data-badge]").forEach(e=>e.setAttribute("aria-pressed",S.badges.includes(e.dataset.badge)));
 document.querySelectorAll("[data-preset]").forEach(e=>e.setAttribute("aria-pressed",e.dataset.preset===S.bgPreset));
 document.querySelectorAll("[data-ring]").forEach(e=>e.setAttribute("aria-pressed",e.dataset.ring===S.ring));
 pane();
}

function pane(){
 const p=$("pane");p.textContent="";
 $("t-f").setAttribute("aria-selected",tab==="f");$("t-b").setAttribute("aria-selected",tab==="b");
 if(tab==="f"){const l=fichas();
  if(!l.length){p.innerHTML='<p class="pf-empty">Nenhuma ficha neste navegador ainda.<br><a href="index.html#fichas" style="color:inherit">Criar a primeira ficha</a></p>';return}
  const w=document.createElement("div");w.className="pf-list";
  l.forEach(f=>{let k="";try{k=FICHAS.read(f.id).sys||""}catch{}
   const a=document.createElement("a");a.href=(PAGES[k]||PAGES[""])+"?id="+f.id;
   const n=document.createElement("span");n.textContent=f.name;const s=document.createElement("small");s.textContent="Abrir";
   a.append(n,s);w.appendChild(a)});p.appendChild(w)}
 else{const w=document.createElement("div");w.className="pf-allb";
  BADGES.forEach(x=>{const e=badge(x);if(S.badges.includes(x.id))e.classList.add("on");w.appendChild(e)});p.appendChild(w)}
}
$("t-f").onclick=()=>{tab="f";pane()};$("t-b").onclick=()=>{tab="b";pane()};

PRESETS.forEach(([id,t])=>{const b=document.createElement("button");b.className="pf-chip";b.type="button";b.dataset.preset=id;
 b.innerHTML=`<i class="bg-${id}"></i><span>${t}</span>`;b.onclick=()=>{S.bgPreset=id;S.bg="";$("f-bg").value="";render()};$("presets").appendChild(b)});
RINGS.forEach(([id,t])=>{const b=document.createElement("button");b.className="pf-chip";b.type="button";b.dataset.ring=id;b.textContent=t;
 b.onclick=()=>{S.ring=id;render()};$("rings").appendChild(b)});
BADGES.forEach(x=>{const b=badge(x,"button");b.type="button";b.dataset.badge=x.id;
 b.onclick=()=>{const i=S.badges.indexOf(x.id);
  if(i>=0)S.badges.splice(i,1);else if(S.badges.length<MAXB)S.badges.push(x.id);else return toast("Máximo de "+MAXB+" insígnias.");render()};
 $("bpick").appendChild(b)});
FIELDS.forEach(([id,k])=>$(id).addEventListener("input",e=>{
 S[k]=k==="handle"?e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,""):e.target.value.trim();render()}));

function toast(m){$("toast").textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").textContent="",3500)}
function close(){$("ov").hidden=true;document.removeEventListener("keydown",esc)}
function cancel(){S=snap;render();close()}
function esc(e){if(e.key==="Escape")cancel()}
$("edit").onclick=()=>{snap=JSON.parse(JSON.stringify(S));FIELDS.forEach(([i,k])=>$(i).value=S[k]);
 $("ov").hidden=false;document.addEventListener("keydown",esc);$("f-name").focus()};
$("cancel").onclick=cancel;
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))cancel()});
$("save").onclick=async()=>{
 if(!S.name)return toast("Escolha um nome.");
 const p={name:S.name.slice(0,24),handle:S.handle.slice(0,20),pron:S.pron.slice(0,16),bio:S.bio.slice(0,140),
  avatar:okUrl(S.avatar)?S.avatar:"",bg:okUrl(S.bg)?S.bg:"",bgPreset:S.bgPreset,ring:S.ring,badges:S.badges.slice(0,MAXB)};
 try{await setDoc(doc(db,"users",user.uid),{...p,updatedAt:serverTimestamp()},{merge:true});
  if(user.displayName!==p.name)await updateProfile(user,{displayName:p.name});
  S={...S,...p};render();close();window.dispatchEvent(new Event("perfil-atualizado"))}
 catch(e){toast("Não foi possível salvar. Confira as regras do Firestore.");console.error(e)}};
</script>
</body>
</html>
